# NOTE: Using custom GHCR image for P1 improvements
# Build and push manually with: docker buildx build --platform linux/arm64 --tag ghcr.io/dinopollece/openfang:latest --load .

version: "3.8"
services:
  openfang:
    image: ghcr.io/dinopollece/openfang:latest
    # build: .  # Uncomment to build locally instead of pulling from GHCR
    ports:
      - "4200:4200"
    volumes:
      - openfang-data:/data
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN:-}
    restart: unless-stopped

volumes:
  openfang-data:
